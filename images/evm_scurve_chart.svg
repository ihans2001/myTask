<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowBlack" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#000000"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#E8940C"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1F7A3D"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="640" height="440" fill="#ffffff"/>

  <!-- Management Reserve band -->
  <rect x="60" y="90" width="340" height="50" fill="#FFF6B0"/>
  <text x="230" y="120" font-size="14" fill="#333333" text-anchor="middle">Reserved Cost</text>

  <!-- horizontal reference lines -->
  <line x1="60" y1="90" x2="400" y2="90" stroke="#E8940C" stroke-width="1.2"/>
  <line x1="400" y1="65" x2="560" y2="65" stroke="#E8940C" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="60" y1="140" x2="400" y2="140" stroke="#333333" stroke-width="1"/>

  <!-- axes -->
  <line x1="60" y1="370" x2="60" y2="20" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <line x1="60" y1="370" x2="600" y2="370" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="20" y="30" font-size="16" fill="#000000">Cost</text>
  <text x="560" y="392" font-size="16" fill="#000000">Time</text>

  <!-- vertical reference lines -->
  <!-- Data Date -->
  <line x1="220" y1="370" x2="220" y2="130" stroke="#000000" stroke-width="1" stroke-dasharray="8,3,2,3"/>
  <text x="196" y="392" font-size="12" fill="#000000">Current Date</text>
  <line x1="220" y1="378" x2="220" y2="371" stroke="#1F7A3D" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Completion Date (planned, BAC/EAC) -->
  <line x1="400" y1="365" x2="400" y2="40" stroke="#000000" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="300" y="300" font-size="12" fill="#000000">Completion Date</text>
  <line x1="350" y1="302" x2="400" y2="368" stroke="#000000" stroke-width="1" marker-end="url(#arrowBlack)"/>

  <!-- Projected Completion Date -->
  <line x1="460" y1="365" x2="460" y2="130" stroke="#000000" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="466" y="285" font-size="12" fill="#000000">Projected</text>
  <text x="466" y="300" font-size="12" fill="#000000">Completion Date</text>
  <line x1="486" y1="302" x2="462" y2="368" stroke="#000000" stroke-width="1" marker-end="url(#arrowBlack)"/>

  <!-- Projected Slippage at Completion -->
  <line x1="402" y1="230" x2="458" y2="230" stroke="#E8940C" stroke-width="1.2" marker-end="url(#arrowOrange)" marker-start="url(#arrowOrange)"/>    
  <text x="466" y="215" font-size="11" fill="#000000" text-anchor="left">Projected</text>
  <text x="466" y="230" font-size="11" fill="#000000" text-anchor="left">Slippage</text>
  <text x="466" y="245" font-size="11" fill="#000000" text-anchor="left">at Completion</text>  
  <text x="466" y="260" font-size="11" fill="#000000" text-anchor="middle" style="display:none"> </text>

  <!-- AC curve: solid to data date, dotted projection to EAC -->
  <path d="M70,367 C110,360 150,320 180,280 C200,260 212,252 220,245"
        fill="none" stroke="#D63A2E" stroke-width="2.5"/>
  <path d="M220,245 C260,210 300,150 340,100 C365,80 385,70 400,65 L560,65"
        fill="none" stroke="#D63A2E" stroke-width="2.5" stroke-dasharray="5,4"/>

  <!-- PV curve: fully solid (the plan), plateaus at BAC -->
  <path d="M70,368 C120,368 150,330 190,290 C205,275 214,262 220,255 C260,220 300,165 340,140 L560,140"
        fill="none" stroke="#2255CC" stroke-width="2.5"/>

  <!-- EV curve: solid to data date, dotted projection to projected completion -->
  <path d="M70,369 C120,369 160,345 195,310 C210,296 216,288 220,280"
        fill="none" stroke="#1F7A3D" stroke-width="2.5"/>
  <path d="M220,280 C270,235 330,180 370,155 C405,148 435,142 460,140 L560,140"
        fill="none" stroke="#1F7A3D" stroke-width="2.5" stroke-dasharray="5,4"/>

  <!-- markers -->
  <circle cx="400" cy="140" r="4" fill="#ffffff" stroke="#000000" stroke-width="1.3"/> <!-- BAC -->
  <circle cx="460" cy="140" r="4" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <circle cx="400" cy="90" r="4" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <circle cx="460" cy="65" r="4" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <circle cx="220" cy="245" r="3.5" fill="#ffffff" stroke="#D63A2E" stroke-width="1.3"/>
  <circle cx="220" cy="255" r="3.5" fill="#ffffff" stroke="#2255CC" stroke-width="1.3"/>
  <circle cx="220" cy="280" r="3.5" fill="#ffffff" stroke="#1F7A3D" stroke-width="1.3"/>
  <circle cx="200" cy="280" r="3.5" fill="#ffffff" stroke="#1F7A3D" stroke-width="1.3"/>  
  <circle cx="400" cy="370" r="3.5" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <circle cx="460" cy="370" r="3.5" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>

  <!-- ETC label + arrow -->
  <text x="335" y="195" font-size="12" fill="#000000" text-anchor="left">Estimate </text>
  <text x="335" y="210" font-size="12" fill="#000000" text-anchor="left">to Complete</text>
  <line x1="330" y1="65" x2="330" y2="243" stroke="#E8940C" stroke-width="1.2" marker-end="url(#arrowOrange)" marker-start="url(#arrowOrange)"/>  
  <line x1="327" y1="65" x2="400" y2="65" stroke="#E8940C" stroke-width="0.8" stroke-dasharray="2,2"/>

  <!-- Total Allocated Budget -->
  <text x="410" y="24" font-size="11" fill="#000000">Total</text>
  <text x="410" y="37" font-size="11" fill="#000000">Allocated</text>
  <text x="410" y="50" font-size="11" fill="#000000">Budget</text>
  <line x1="420" y1="53" x2="403" y2="87" stroke="#000000" stroke-width="1" marker-end="url(#arrowBlack)"/>

  <!-- EAC -->
  <text x="496" y="24" font-size="12" fill="#000000" text-anchor="left">Estimate </text>
  <text x="496" y="39" font-size="12" fill="#000000" text-anchor="left">at Completion</text>  
  <line x1="498" y1="43" x2="462" y2="63" stroke="#000000" stroke-width="1" marker-end="url(#arrowBlack)"/>

  <!-- Projected Overrun at Completion (VAC) -->
  <text x="466" y="90" font-size="11" fill="#000000">Projected</text>
  <text x="466" y="103" font-size="11" fill="#000000">Overrun at</text>
  <text x="466" y="116" font-size="11" fill="#000000">Completion (VAC)</text>
  <line x1="460" y1="68" x2="460" y2="136" stroke="#E8940C" stroke-width="1.2" marker-end="url(#arrowOrange)" marker-start="url(#arrowOrange)"/>

  <!-- BAC label -->
  <text x="496" y="170" font-size="12" fill="#000000" text-anchor="left">Budget </text>
  <text x="496" y="185" font-size="12" fill="#000000" text-anchor="left">at Completion</text>  
  <line x1="494" y1="166" x2="404" y2="141" stroke="#000000" stroke-width="1" marker-end="url(#arrowBlack)"/>

  <!-- CV / SV -->
  <line x1="238" y1="245" x2="238" y2="280" stroke="#E8940C" stroke-width="1.2" marker-end="url(#arrowOrange)" marker-start="url(#arrowOrange)"/>
  <text x="243" y="266" font-size="11" fill="#E8940C">Cost Variance(CV)</text>
  <line x1="220" y1="245" x2="342" y2="245" stroke="#E8940C" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="220" y1="280" x2="250" y2="280" stroke="#E8940C" stroke-width="0.8" stroke-dasharray="2,2"/>  

  <line x1="192" y1="255" x2="192" y2="280" stroke="#E8940C" stroke-width="1.2" marker-end="url(#arrowOrange)" marker-start="url(#arrowOrange)"/>
  <text x="72" y="270" font-size="11" fill="#E8940C">Schedule Variance(SV)</text>
  <line x1="60" y1="255" x2="220" y2="255" stroke="#E8940C" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="60" y1="280" x2="220" y2="280" stroke="#E8940C" stroke-width="0.8" stroke-dasharray="2,2"/>

  <!-- Behind Schedule -->
  <path d="M200,280 C190,295 160,300 130,300" fill="none" stroke="#1F7A3D" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowGreen)"/>
  <text x="96" y="295" font-size="11" fill="#1F7A3D">Behind</text>
  <text x="88" y="309" font-size="11" fill="#1F7A3D">Schedule</text>

  <!-- Legend -->
  <line x1="72" y1="200" x2="96" y2="200" stroke="#2255CC" stroke-width="2.5"/>
  <text x="102" y="204" font-size="12" fill="#000000">Planned Value(PV)</text>
  <line x1="72" y1="215" x2="96" y2="215" stroke="#1F7A3D" stroke-width="2.5"/>
  <text x="102" y="219" font-size="12" fill="#000000">Earned Value(EV)</text>
  <line x1="72" y1="230" x2="96" y2="230" stroke="#D63A2E" stroke-width="2.5"/>
  <text x="102" y="234" font-size="12" fill="#000000">Actual Cost(AC)</text>
</svg>
